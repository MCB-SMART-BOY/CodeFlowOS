name: Delete merged fork branches after 72 hours

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete eligible branches
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const organization = { owner: "CS-CodeFlow", repo: "CodeFlowOS" };
            const fork = { owner: "MCB-SMART-BOY", repo: "CodeFlowOS" };
            const forkName = `${fork.owner}/${fork.repo}`.toLowerCase();
            const gracePeriodMs = 72 * 60 * 60 * 1000;

            async function listPullRequests(state) {
              const pullRequests = [];
              for (let page = 1; ; page++) {
                const url = new URL(`https://api.github.com/repos/${organization.owner}/${organization.repo}/pulls`);
                url.searchParams.set("state", state);
                url.searchParams.set("per_page", "100");
                url.searchParams.set("page", String(page));

                const response = await fetch(url, {
                  headers: {
                    accept: "application/vnd.github+json",
                    "x-github-api-version": "2022-11-28",
                  },
                });
                if (!response.ok) {
                  throw new Error(`Could not list ${state} PRs: ${response.status} ${await response.text()}`);
                }

                const batch = await response.json();
                pullRequests.push(...batch);
                if (batch.length < 100) return pullRequests;
              }
            }

            const [closedPRs, openPRs, forkInfo] = await Promise.all([
              listPullRequests("closed"),
              listPullRequests("open"),
              github.rest.repos.get(fork),
            ]);
            const defaultBranch = forkInfo.data.default_branch;
            const openForkBranches = new Set(
              openPRs
                .filter(pr => pr.head.repo?.full_name?.toLowerCase() === forkName)
                .map(pr => pr.head.ref),
            );

            const latestMergedPRByBranch = new Map();
            for (const pr of closedPRs) {
              if (!pr.merged_at || pr.head.repo?.full_name?.toLowerCase() !== forkName) continue;

              const mergedAt = Date.parse(pr.merged_at);
              const previous = latestMergedPRByBranch.get(pr.head.ref);
              if (!previous || mergedAt > previous.mergedAt) {
                latestMergedPRByBranch.set(pr.head.ref, { mergedAt, headSha: pr.head.sha });
              }
            }

            for (const [branch, mergedPR] of latestMergedPRByBranch) {
              if (branch === defaultBranch || openForkBranches.has(branch)) continue;
              if (Date.now() - mergedPR.mergedAt < gracePeriodMs) {
                core.info(`Keeping ${branch}: merged less than 72 hours ago.`);
                continue;
              }

              let branchInfo;
              try {
                branchInfo = await github.rest.repos.getBranch({ ...fork, branch });
              } catch (error) {
                if (error.status === 404) {
                  core.info(`Keeping ${branch}: branch no longer exists.`);
                  continue;
                }
                throw error;
              }

              if (branchInfo.data.protected || branchInfo.data.commit.sha !== mergedPR.headSha) {
                core.info(`Keeping ${branch}: protected or changed since the merged PR.`);
                continue;
              }

              await github.rest.git.deleteRef({ ...fork, ref: `heads/${branch}` });
              core.notice(`Deleted ${forkName}:${branch} more than 72 hours after merge.`);
            }
